<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Alesya Mishchanina">
  <meta name="copyright" content="Concept and prototype © Alesya Mishchanina, 2026">
  <title>WB Бренды 2.0 — прототип</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/kit.css?v=512fca7e">
  <link rel="stylesheet" href="assets/prototype.css?v=512fca7e">
</head>
<body class="proto" data-mode="mobile">

  <main class="proto__stage">
    <div class="proto__device" id="device">
      <div class="proto__screen" id="screen"></div>
    </div>
  </main>

  <!-- плавающая панель управления показом -->
  <div class="proto__bar">
    <button class="proto__btn" id="back" title="Назад">‹</button>
    <button class="proto__btn" id="home" title="На главную">⌂</button>

    <div class="proto__seg" role="group" aria-label="Платформа">
      <button data-mode="mobile" aria-pressed="true">390</button>
      <button data-mode="desktop" aria-pressed="false">1440</button>
    </div>

    <button class="proto__btn proto__btn--wide" id="menuBtn" aria-expanded="false" aria-controls="menu">Экраны</button>
    <a class="proto__btn proto__btn--wide" href="wireframes.html">Документ</a>
  </div>

  <!-- список экранов -->
  <div class="proto__menu" id="menu" hidden>
    <div class="proto__menu-head">
      <span>Куда перейти</span>
      <button class="proto__btn" id="menuClose" aria-label="Закрыть список экранов">✕</button>
    </div>
    <div class="proto__menu-body" id="menuBody"></div>
  </div>

  <script type="module" src="assets/prototype.js?v=512fca7e"></script>
</body>
</html>
